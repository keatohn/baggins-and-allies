
name: OpenCode

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install OpenCode
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/opencode.tar.gz" \
            https://github.com/anomalyco/opencode/releases/download/v1.19.5/opencode-linux-x64-baseline.tar.gz
          echo "17c200fd4b2289954cc01552559f9b6d03ec157b2ddfb5eb54144f491656333d  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP"

      - name: Run OpenCode
        run: '"$RUNNER_TEMP/opencode" github run'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: opencode/mimo-v2.6-flash-free
          USE_GITHUB_TOKEN: "true"
